# ---------------------------------------------------------------
# JADE platform
# ---------------------------------------------------------------
jade.host=localhost
jade.port=1099
# true opens the JADE Remote Management Agent GUI (handy for the Sniffer and DF view)
jade.gui=false

# ---------------------------------------------------------------
# Agents to start, in this order, separated by ';'
# Format:  name:fully.qualified.ClassName(arg1,arg2,...)
# Providers and the Planner come before the User so they are
# ready by the time the User sends its first message.
# ---------------------------------------------------------------
# Dummy providers: DummyProviderAgent(service type, price EUR, description) - no commas in the description
agents=transport1:travelplanner.agents.DummyProviderAgent(transport,120,Train 4h 30min);\
       transport2:travelplanner.agents.DummyProviderAgent(transport,85,Bus 7h);\
       transport3:travelplanner.agents.DummyProviderAgent(transport,160,Plane 1h 20min);\
       hotel1:travelplanner.agents.DummyProviderAgent(accommodation,450,Hotel 3* centre);\
       hotel2:travelplanner.agents.DummyProviderAgent(accommodation,300,Hostel 2 km from centre);\
       hotel3:travelplanner.agents.DummyProviderAgent(accommodation,520,Apartment 1 km from centre);\
       recommender:travelplanner.agents.RecommendationAgent;\
       planner:travelplanner.agents.PlannerAgent;\
       user:travelplanner.agents.UserAgent

# ---------------------------------------------------------------
# User agent
# ---------------------------------------------------------------
# console for now (a gui option can be added later)
user.ui=console
# local name of the Planner agent to send requests to
user.planner=planner
# how long the console waits for the Planner's reply before showing the menu again
user.replyTimeoutSec=30
# quitting the User agent stops the whole platform (and the program)
user.shutdownPlatformOnQuit=true