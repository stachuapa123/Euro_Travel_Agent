# ---------------------------------------------------------------
# JADE platform
# ---------------------------------------------------------------
jade.host=localhost
jade.port=1099
# true opens the JADE Remote Management Agent GUI (handy for the Sniffer and DF view)
jade.gui=false

# ---------------------------------------------------------------
# Agents to start, in this order, separated by ';'
# Format:  name:fully.qualified.ClassName(arg1,arg2,...)
# Providers and the Planner come before the User so they are
# ready by the time the User sends its first message.
# ---------------------------------------------------------------
agents=planner:travelplanner.agents.PlannerAgent;\
       user:travelplanner.agents.UserAgent

# ---------------------------------------------------------------
# Sample trip request (read by the User agent)
# priority: LOW_COST | FAST | COMFORT
# ---------------------------------------------------------------
request.origin=Gdansk
request.destination=Krakow
request.nights=3
request.budgetEur=600
request.maxLegHours=10
request.accommodationType=HOTEL
request.minStars=3
request.breakfast=true
request.priority=LOW_COST
